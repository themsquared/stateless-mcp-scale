apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateless-mcp-demo
  namespace: stateless-mcp-scale
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stateless-mcp-demo
  template:
    metadata:
      labels:
        app: stateless-mcp-demo
    spec:
      containers:
        - name: mcp-server
          image: stateless-mcp-demo:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: stateless-mcp-demo
  namespace: stateless-mcp-scale
spec:
  selector:
    app: stateless-mcp-demo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
